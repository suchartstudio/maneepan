<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🌟 นาฬิกา มุมขวาบน -->
    <div class="clock-container">
        <div class="clock-time" id="current-time">00:00:00</div>
        <div class="clock-date" id="current-date">กำลังโหลดวันเวลา...</div>
    </div>

    <div class="layout-wrapper">
        <div class="price-display-full">
            
            <!-- โลโก้ร้าน -->
            <div class="logo-container">
                <img src="logo.png" alt="ร้านทองแม่แตง Logo" class="main-logo" onerror="this.style.display='none'">
            </div>

            <!-- ราคาทองคำแท่ง -->
            <div class="gold-category">
                <div class="gold-title">ราคาทองคำแท่ง 96.5%</div>
                <div class="price-container">
                    <div class="price-row">
                        <div class="price-label">รับซื้อ</div>
                        <div class="price-value" id="bar-buy">-</div>
                    </div>
                    <div class="price-row">
                        <div class="price-label">ขายออก</div>
                        <div class="price-value" id="bar-sell">-</div>
                    </div>
                </div>
            </div>

            <!-- ราคาทองรูปพรรณ (มีเฉพาะรับซื้อ หัก 5%) -->
            <div class="gold-category">
                <div class="gold-title">ราคาทองรูปพรรณ 96.5%</div>
                <div class="price-container single-price">
                    <div class="price-row">
                        <div class="price-label">รับซื้อ</div>
                        <div class="price-value" id="ornament-buy">-</div>
                    </div>
                </div>
            </div>

            <!-- เวลาอัปเดตราคาจากระบบ -->
            <div class="update-time" id="update-time">อัพเดทราคาล่าสุด: -</div>

        </div>
    </div>

    <!-- แถบตัววิ่งด้านล่าง -->
    <div class="marquee-section">
        <marquee scrollamount="6" id="marquee-text">กำลังโหลดข้อมูล...</marquee>
    </div>

    <!-- Element ที่ซ่อนไว้เพื่อป้องกัน JavaScript Error จาก display.js -->
    <div id="media-container" style="display: none;"></div>
    <div id="ornament-sell" style="display: none;">-</div>

    <script type="module" src="display.js"></script>

    <!-- 🌟 สคริปต์สำหรับให้นาฬิกาเดินอัตโนมัติ -->
    <script>
        function updateClock() {
            const now = new Date();
            // จัดรูปแบบเวลา HH:mm:ss
            const timeString = now.toLocaleTimeString('th-TH', { hour12: false });
            // จัดรูปแบบวันที่ เช่น วันพฤหัสบดีที่ 30 กรกฎาคม 2569
            const dateString = now.toLocaleDateString('th-TH', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            document.getElementById('current-time').innerText = timeString;
            document.getElementById('current-date').innerText = dateString;
        }
        setInterval(updateClock, 1000); // อัปเดตทุก 1 วินาที
        updateClock(); // เรียกใช้งานครั้งแรกทันที
    </script>

</body>
</html>
